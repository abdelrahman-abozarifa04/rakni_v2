        * `ERROR` - ERROR
    AlertTypeEnum:
      enum:
      - CAPACITY
      - BLACKLIST
      - MAINTENANCE
      - SYSTEM
      type: string
      description: |-
        * `CAPACITY` - Capacity Alert
        * `BLACKLIST` - Blacklist Alert
        * `MAINTENANCE` - Maintenance Alert
        * `SYSTEM` - System Alert
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Ø§Ø³Ù… Ø§Ù„Ù…Ø³ØªØ®Ø¯Ù…
        password:
          type: string
          writeOnly: true
          title: ÙƒÙ„Ù…Ø© Ø§Ù„Ù…Ø±ÙˆØ±
        token:
          type: string
          readOnly: true
          title: Ø§Ù„Ø±Ù…Ø²
      required:
      - password
      - token
      - username
    Blacklist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plate_number:
          type: string
          maxLength: 20
        reason:
          type: string
          maxLength: 255
        added_date:
          type: string
          format: date-time
          readOnly: true
        added_by:
          type: string
          maxLength: 100
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
